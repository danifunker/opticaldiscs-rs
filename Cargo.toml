[package]
name = "opticaldiscs"
version = "0.14.0"
edition = "2021"
license = "GPL-3.0"
description = "Format-agnostic optical disc image reading and filesystem browsing (ISO, BIN/CUE, CHD)"
repository = "https://github.com/danifunker/opticaldiscs-rs"
keywords = ["cd-rom", "dvd", "iso9660", "disc-image", "chd"]
categories = ["filesystem", "encoding", "parser-implementations"]

[features]
# `chd` is ON by default: CHD is one of this crate's headline container formats,
# so a plain `cargo add opticaldiscs` keeps reading `.chd` files. Turn it off
# (`default-features = false`) on targets where libchdman-rs can't be built or
# fetched — it is a `links` crate wrapping MAME's C++ CHD core, and its
# `prebuilt` feature downloads a static archive at build time. See the `chd`
# entry below.
default = ["chd"]
toc    = ["dep:sha1", "dep:base64"]   # MusicBrainz + FreeDB DiscID calculation
drives = []                            # physical optical drive enumeration
# MAME CHD (`.chd`) reading, via libchdman-rs. Without it the crate still
# *recognises* `.chd` (extension + `MComprHD` magic) but opening one fails with
# `UnsupportedFormat`; ask at runtime with `DiscFormat::Chd.is_supported()` or
# `chd::is_supported()`. Dropping it also drops libchdman-rs's build-time
# archive download (ureq/sha2/hex), which matters for offline and cross builds.
chd    = ["dep:libchdman-rs"]
# DAEMON Tools MDX (.mdx / MDSv2): the descriptor is always AES-256-encrypted and
# zlib-compressed, so this optional feature pulls in a small crypto stack. Left off
# by default to keep the base build dependency-light.
mdx    = ["dep:aes", "dep:pbkdf2", "dep:ripemd"]

[dependencies]
thiserror = "2"
log       = "0.4"
cue_sheet = "0.3"

# optional: only needed with feature "chd" (on by default)
libchdman-rs = { version = "0.288.8", features = ["prebuilt"], optional = true }

encoding_rs = "0.8"   # Shift-JIS (etc.) decoding for Japanese console headers
flate2 = "1"          # deflate/gzip: PSP CSO blocks and gzip-compressed ISOs

# optional: only needed with feature "toc"
sha1   = { version = "0.11", optional = true }
base64 = { version = "0.22", optional = true }
nod = "1.4"

# optional: only needed with feature "mdx" (DAEMON Tools MDX crypto stack)
aes    = { version = "0.8", optional = true }
pbkdf2 = { version = "0.12", optional = true, default-features = false, features = ["hmac"] }
ripemd = { version = "0.1", optional = true }

# Medium-capacity ioctls for physical drives (feature "drives"). Unix only:
# lseek(SEEK_END) reports 0 on a macOS raw disk device, so the size has to come
# from DKIOCGETBLOCKCOUNT / BLKGETSIZE64.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
