  name: Publish to crates.io

  on:
    workflow_dispatch:
      inputs:
        dry_run:
          description: 'Validate only — do not tag, release, or publish'
          type: boolean
          default: false

  permissions:
    contents: write   # needed to create tag + release

  jobs:
    preflight:
      name: Preflight (derive tag, slim tarball)
      runs-on: ubuntu-latest
      outputs:
        tag: ${{ steps.derive.outputs.tag }}
      steps:
        - uses: actions/checkout@v5

        - uses: dtolnay/rust-toolchain@stable

        - name: Derive tag from Cargo.toml
          id: derive
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            set -euo pipefail
            version=$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            tag="v$version"
            echo "Derived tag: $tag"
            if git ls-remote --tags --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Tag $tag already exists on origin — bump Cargo.toml version first."
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::GitHub Release $tag already exists."
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"

        - name: Verify slim tarball contents
          run: |
            set -euo pipefail
            cargo package --no-verify --list > /tmp/package-files.txt
            echo "--- Files in tarball ---"
            cat /tmp/package-files.txt
            if grep -E '\.(bin|chd|iso|cue|so|dylib|dll|a)$' /tmp/package-files.txt; then
              echo "::error::Binary/fixture files in package — add to [package.exclude] in Cargo.toml."
              exit 1
            fi
            cargo package --no-verify
            size=$(stat -c%s target/package/opticaldiscs-*.crate)
            echo "Tarball size: $size bytes"
            if [ "$size" -gt 2097152 ]; then
              echo "::error::Tarball exceeds 2 MB cap."
              exit 1
            fi

        - uses: actions/upload-artifact@v6
          with:
            name: crate-tarball
            path: target/package/opticaldiscs-*.crate

    publish:
      name: Tag, release, publish
      needs: preflight
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5

        - uses: dtolnay/rust-toolchain@stable

        - name: Create tag and GitHub Release
          if: github.event.inputs.dry_run != 'true'
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            TAG: ${{ needs.preflight.outputs.tag }}
          run: |
            set -euo pipefail
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes

        - name: Publish to crates.io
          env:
            CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
            DRY_RUN: ${{ github.event.inputs.dry_run }}
          run: |
            set -euo pipefail
            if [ "$DRY_RUN" = "true" ]; then
              cargo publish --dry-run
            else
              cargo publish
            fi